name: CI

on:
  push:
    branches: [main]
  pull_request:

# Aynı daldaki eski koşu, yenisi başlayınca iptal edilir.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine · tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      # Kilit dosyası: CI yerelde doğrulanan birebir ortamda koşar; aralıklar
      # (requirements.txt) içindeki yeni bir sürüm CI'ı habersizce kırmaz.
      - run: pip install -r requirements-lock.txt

      # Veri gerektiren testler data/ yokken kendiliğinden atlanır.
      - run: python -m pytest -q

      # API sözleşmesi ile commit'lenmiş openapi.json ayrışmamalı: ayrışırsa
      # frontend tipleri (src/types/api.ts) bayattır.
      - name: OpenAPI schema is up to date
        run: |
          python -c "import json, engine.api.main; open('frontend/openapi.json','w',encoding='utf-8').write(json.dumps(engine.api.main.app.openapi(), indent=2, ensure_ascii=False))"
          git diff --exit-code frontend/openapi.json

  frontend:
    name: Frontend · types, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # src/types/api.ts elle düzenlenmez; openapi.json'dan üretilmiş hâliyle aynı olmalı.
      - name: API types match openapi.json
        run: |
          npx openapi-typescript openapi.json -o src/types/api.ts
          git diff --exit-code src/types/api.ts

      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm run build
